<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan Nguyen Tien - AI-Augmented QA Engineer</title>
    <script>
      // Apply theme + locale before paint to prevent FOUC.
      // Theme precedence: explicit choice > OS preference > brand default (dark).
      // Locale precedence: explicit choice > brand default 'en'.
      // (Browser language auto-detect intentionally disabled — recruiters prefer
      // the canonical English version unless they explicitly switch.)
      (function () {
        var root = document.documentElement;
        try {
          var storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark') {
            root.classList.add('dark');
          } else if (storedTheme !== 'light') {
            var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (!prefersLight) root.classList.add('dark');
          }
        } catch (e) {
          root.classList.add('dark');
        }

        try {
          var storedLocale = localStorage.getItem('locale');
          root.lang =
            storedLocale === 'vi' || storedLocale === 'ja' ? storedLocale : 'en';
        } catch (e) {
          root.lang = 'en';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased overflow-x-hidden selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
